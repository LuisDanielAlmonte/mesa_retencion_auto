<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Retención Auto</title>
<meta name="description" content="Mesa de Retención de Auto — Proyección de churn 2026 del producto Mi Auto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00b4e6;
    --cyan-soft: #e3f6fd;
    --blue: #0067b1;
    --navy: #0b2f5b;
    --orange: #ffa94d;
    --alert: #e8590c;
    --ink: #1c2b3a;
    --muted: #6b7c8f;
    --line: #e4ebf2;
    --row-hl: #e6f4fb;
    --stage-bg: #0a1522;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--stage-bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Deck: lienzo fijo 1920×1080 escalado a la ventana ---------- */
  .viewport { position: fixed; inset: 0; }
  .deck {
    width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%;
    transform-origin: center center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .slide {
    position: absolute; inset: 0; overflow: hidden;
    background: #fff;
    opacity: 0; visibility: hidden; transition: opacity .35s ease;
  }
  .slide.active { opacity: 1; visibility: visible; }

  /* Decoración de marca */
  .deco { position: absolute; pointer-events: none; }
  .deco.tl1 { top: -120px; left: -260px; width: 620px; height: 120px; background: var(--cyan); transform: rotate(-38deg); }
  .deco.tl2 { top: -10px; left: -300px; width: 620px; height: 70px; background: var(--blue); transform: rotate(-38deg); }
  .deco.br1 { bottom: -40px; right: -200px; width: 640px; height: 130px; background: var(--cyan); transform: rotate(-38deg); }
  .deco.br2 { bottom: 40px; right: -260px; width: 560px; height: 60px; background: var(--blue); transform: rotate(-38deg); }
  .deco.band { left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, var(--navy), var(--blue) 45%, var(--cyan)); }

  .content { position: absolute; inset: 56px 110px 50px 110px; display: flex; flex-direction: column; }

  /* Encabezado */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--blue);
  }
  .eyebrow .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
  h1 { margin: 8px 0 0; font-size: 66px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--cyan); }
  h1 .brand { color: var(--orange); }
  .section-tag {
    display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 500; color: var(--navy);
  }
  .section-tag .num {
    width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #fff; font-weight: 700; font-size: 24px;
  }

  /* Tabla */
  .table-wrap { margin-top: 34px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 40px -26px rgba(11,47,91,.45); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  thead th { background: var(--cyan); color: #fff; font-weight: 500; font-size: 21px; padding: 14px 6px; text-align: center; white-space: nowrap; }
  thead th.proj { background: var(--blue); }
  thead th.corner { background: #fff; color: var(--muted); text-align: left; padding-left: 26px; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
  thead tr.phase th { padding: 9px; font-size: 15px; font-weight: 700; letter-spacing: .24em; }
  thead tr.phase th.real { background: var(--cyan-soft); color: var(--cyan); }
  thead tr.phase th.proj { background: var(--navy); color: #fff; }
  tbody th { text-align: left; font-weight: 500; font-size: 21px; padding: 13px 26px; white-space: nowrap; border-top: 1px solid var(--line); }
  tbody td { text-align: center; padding: 13px 6px; font-size: 21px; border-top: 1px solid var(--line); }
  tbody td.proj { background: rgba(0,103,177,.05); font-style: italic; }
  tbody tr.hl th, tbody tr.hl td { background: var(--row-hl); font-weight: 600; color: var(--blue); }
  td.over { color: var(--alert) !important; }

  /* Fila inferior */
  .bottom { margin-top: 26px; flex: 1; display: grid; grid-template-columns: 1fr 360px; gap: 26px; min-height: 0; }
  .chart-box { border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px 6px; display: flex; flex-direction: column; min-height: 0; }
  .chart-box h3, .kpi h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .chart-box .chart-head { display: flex; justify-content: space-between; align-items: center; }
  .legend { display: flex; gap: 22px; font-size: 16px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 22px; height: 0; border-top: 3px solid; display: inline-block; }
  .legend .r i { border-color: var(--cyan); }
  .legend .p i { border-color: var(--blue); border-top-style: dotted; }
  .legend .o i { border-color: var(--orange); border-top-style: dashed; }
  .chart-box svg { flex: 1; width: 100%; min-height: 0; display: block; }

  .kpis { display: grid; grid-template-rows: 1.25fr 1fr 1fr; gap: 16px; min-height: 0; }
  .kpi { border-radius: 18px; padding: 18px 26px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--line); }
  .kpi .v { font-size: 50px; font-weight: 700; line-height: 1.05; margin-top: 4px; }
  .kpi .s { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .kpi.main { background: linear-gradient(150deg, var(--blue), var(--navy)); border: 0; color: #fff; }
  .kpi.main h3 { color: rgba(255,255,255,.7); }
  .kpi.main .v { font-size: 66px; }
  .pill { display: inline-block; margin-top: 8px; align-self: flex-start; font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: rgba(111,224,166,.18); color: #6fe0a6; }
  .kpi .v.orange { color: var(--orange); }
  .kpi .v.blue { color: var(--blue); }

  /* ---------- Controles ---------- */
  .controls {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px;
    background: rgba(11,47,91,.82); color: #fff; backdrop-filter: blur(6px);
    font-size: 14px; opacity: 0; transition: opacity .25s; z-index: 10;
  }
  body:hover .controls, .controls:focus-within { opacity: 1; }
  .controls button {
    all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-size: 18px;
  }
  .controls button:hover { background: rgba(255,255,255,.15); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls .count { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
  @media (hover: none) { .controls { opacity: 1; } }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { overflow: visible; height: auto; background: #fff; }
    .viewport { position: static; display: block; }
    .deck { position: static; transform: none !important; box-shadow: none; height: auto; }
    .slide { position: relative; opacity: 1; visibility: visible; width: 1920px; height: 1080px; break-after: page; }
    .controls { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="deck" id="deck">

    <!-- ================= Slide 1: Certificados ================= -->
    <section class="slide" aria-label="Proyección de Churn 2026 · Mi Auto — Certificados">
      <div class="deco tl1"></div><div class="deco tl2"></div>
      <div class="deco br1"></div><div class="deco br2"></div>
      <div class="deco band"></div>

      <div class="content">
        <div class="head">
          <div>
            <span class="eyebrow"><span class="dot"></span>Mesa de Retención · Auto</span>
            <h1>Proyección de Churn 2026 <span class="brand">· Mi Auto</span></h1>
          </div>
          <div class="section-tag"><span class="num">1</span>Certificados</div>
        </div>

        <div class="table-wrap"><table id="t-cert"></table></div>

        <div class="bottom">
          <div class="chart-box">
            <div class="chart-head">
              <h3>Churn mensual vs. objetivo</h3>
              <div class="legend">
                <span class="r"><i></i>Real</span>
                <span class="p"><i></i>Proyección</span>
                <span class="o"><i></i>Objetivo</span>
              </div>
            </div>
            <svg id="c-cert" viewBox="0 0 1300 330" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Churn mensual de certificados contra objetivo de 2.54%"></svg>
          </div>
          <div class="kpis">
            <div class="kpi main">
              <h3>Churn 2026</h3>
              <div class="v">2.38%</div>
              <span class="pill">16 pb bajo objetivo</span>
            </div>
            <div class="kpi">
              <h3>Objetivo</h3>
              <div class="v orange">2.54%</div>
            </div>
            <div class="kpi">
              <h3>Cartera a diciembre</h3>
              <div class="v blue">73,630</div>
              <div class="s">Certificados proyectados</div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>

<nav class="controls" aria-label="Navegación de diapositivas">
  <button id="prev" aria-label="Anterior">‹</button>
  <span class="count" id="count">1 / 1</span>
  <button id="next" aria-label="Siguiente">›</button>
  <button id="fs" aria-label="Pantalla completa" title="Pantalla completa (F)">⛶</button>
</nav>

<script>
  /* ---------- Datos ---------- */
  const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const REAL = 9; // ene–sep real; oct–dic proyección
  const OBJETIVO = 2.54;
  const cert = [
    { label: "Cartera",                   fmt: "int", data: [60290,62342,63568,64883,66107,67632,68844,70242,71122,71609,72619,73630] },
    { label: "Emisiones / Inclusiones",   fmt: "int", data: [3376,2667,2922,2752,2744,2920,3152,2676,2439,2792,2793,2793] },
    { label: "Churn",                     fmt: "pct", hl: true, data: [2.20,2.31,2.53,2.36,1.84,2.53,2.55,2.56,2.74,2.49,2.45,2.42] },
    { label: "Cancelaciones",             fmt: "int", data: [1324,1441,1607,1528,1219,1708,1754,1796,1952,1782,1782,1782] },
    { label: "Crecimiento de la Cartera", fmt: "int", data: [2052,1226,1315,1224,1525,1212,1398,880,487,1010,1011,1011] },
  ];
  const fmt = {
    int: v => v.toLocaleString("en-US"),
    pct: v => v.toFixed(2) + "%",
  };

  /* ---------- Tabla ---------- */
  function renderTable(id, rows, objective) {
    let h = '<thead><tr class="phase"><th class="corner"></th>' +
            `<th class="real" colspan="${REAL}">REAL</th><th class="proj" colspan="${12 - REAL}">PROYECCIÓN</th></tr>` +
            '<tr><th class="corner">Concepto</th>' +
            MONTHS.map((m, i) => `<th class="${i >= REAL ? "proj" : ""}">${m}</th>`).join("") + "</tr></thead><tbody>";
    rows.forEach(r => {
      h += `<tr class="${r.hl ? "hl" : ""}"><th scope="row">${r.label}</th>` +
        r.data.map((v, i) => {
          const cls = [i >= REAL ? "proj" : "", r.hl && objective && v > objective ? "over" : ""].join(" ").trim();
          return `<td class="${cls}">${fmt[r.fmt](v)}</td>`;
        }).join("") + "</tr>";
    });
    document.getElementById(id).innerHTML = h + "</tbody>";
  }

  /* ---------- Gráfico ---------- */
  function renderChart(id, values, objective) {
    const C = { cyan: "#00b4e6", blue: "#0067b1", orange: "#ffa94d", alert: "#e8590c", line: "#e4ebf2", muted: "#6b7c8f", ink: "#1c2b3a" };
    const W = 1300, H = 330, L = 56, R = 14, T = 22, B = 34;
    const all = values.concat(objective || []);
    const min = Math.floor((Math.min(...all) - 0.2) * 2) / 2;
    const max = Math.ceil((Math.max(...all) + 0.15) * 2) / 2;
    const x = i => L + (W - L - R) * (i + 0.5) / 12;
    const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
    let s = "";
    for (let v = min; v <= max + 1e-9; v += 0.5) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${C.line}"/>`;
      s += `<text x="${L - 10}" y="${y(v) + 5}" text-anchor="end" font-size="15" fill="${C.muted}">${v.toFixed(1)}%</text>`;
    }
    const px = (x(REAL - 1) + x(REAL)) / 2;
    s += `<rect x="${px}" y="${T}" width="${W - R - px}" height="${H - T - B}" fill="${C.blue}" opacity=".06" rx="8"/>`;
    s += `<text x="${(px + W - R) / 2}" y="${H - B - 10}" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="${C.blue}" opacity=".7">PROYECCIÓN</text>`;
    MONTHS.forEach((m, i) => s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="16" fill="${C.muted}">${m.slice(0, 3)}</text>`);
    if (objective) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(objective)}" y2="${y(objective)}" stroke="${C.orange}" stroke-width="2.5" stroke-dasharray="9 7"/>`;
    }
    const pts = values.map((v, i) => [x(i), y(v)]);
    s += `<defs><linearGradient id="${id}-g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${C.cyan}" stop-opacity=".25"/><stop offset="1" stop-color="${C.cyan}" stop-opacity="0"/></linearGradient></defs>`;
    s += `<path d="M${pts[0][0]},${y(min)} ${pts.map(p => "L" + p.join(",")).join(" ")} L${pts[11][0]},${y(min)} Z" fill="url(#${id}-g)"/>`;
    const path = a => a.map((p, i) => (i ? "L" : "M") + p.join(",")).join(" ");
    s += `<path d="${path(pts.slice(0, REAL))}" fill="none" stroke="${C.cyan}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<path d="${path(pts.slice(REAL - 1))}" fill="none" stroke="${C.blue}" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>`;
    pts.forEach((p, i) => {
      const over = objective && values[i] > objective;
      const col = over ? C.alert : (i >= REAL ? C.blue : C.cyan);
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="#fff" stroke="${col}" stroke-width="3.5"><title>${MONTHS[i]}: ${values[i].toFixed(2)}%</title></circle>`;
      const dip = values[i] < (values[i - 1] ?? Infinity) && values[i] < (values[i + 1] ?? Infinity);
      s += `<text x="${p[0]}" y="${dip ? p[1] + 30 : p[1] - 16}" text-anchor="middle" font-size="16" font-weight="600" fill="${over ? C.alert : C.ink}">${values[i].toFixed(2)}%</text>`;
    });
    document.getElementById(id).innerHTML = s;
  }

  renderTable("t-cert", cert, OBJETIVO);
  renderChart("c-cert", cert[2].data, OBJETIVO);

  /* ---------- Motor de presentación ---------- */
  const deck = document.getElementById("deck");
  const slides = [...deck.querySelectorAll(".slide")];
  const count = document.getElementById("count");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  let cur = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), slides.length - 1);

  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    deck.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  function show(n) {
    cur = Math.min(Math.max(n, 0), slides.length - 1);
    slides.forEach((s, i) => s.classList.toggle("active", i === cur));
    count.textContent = `${cur + 1} / ${slides.length}`;
    prev.disabled = cur === 0;
    next.disabled = cur === slides.length - 1;
    history.replaceState(null, "", "#" + (cur + 1));
  }
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }

  addEventListener("resize", fit);
  addEventListener("keydown", e => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key.toLowerCase() === "f") toggleFs();
  });
  prev.onclick = () => show(cur - 1);
  next.onclick = () => show(cur + 1);
  document.getElementById("fs").onclick = toggleFs;

  // Deslizar en pantallas táctiles
  let tx = null;
  addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
  addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    tx = null;
  });

  fit();
  show(cur);
</script>
</body>
</html>
